name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zenhyre
          POSTGRES_PASSWORD: zenhyre
          POSTGRES_DB: zenhyre
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U zenhyre" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://zenhyre:zenhyre@localhost:5433/zenhyre
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test --force
